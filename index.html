<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Orb — визуал голоса ИИ-агента</title>
<style>
  :root { --fg: #bfe6ff; --dim: #5d7d96; --accent: #3ab0ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02050b; overflow: hidden;
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--fg); }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.65) 100%); }
  #status { position: fixed; top: 14px; left: 18px; letter-spacing: .18em; text-transform: uppercase;
    font-size: 11px; color: var(--dim); }
  #status b { color: var(--fg); font-weight: 600; }
  #caption { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(80vw, 760px);
    text-align: center; font-size: 17px; color: #d8f0ff; text-shadow: 0 0 18px rgba(60,170,255,.6);
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  #caption.on { opacity: 1; }
  #bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 6px;
    flex-wrap: wrap; justify-content: center; padding: 8px; max-width: 96vw;
    background: rgba(6,14,26,.62); border: 1px solid rgba(80,160,255,.22); border-radius: 14px;
    backdrop-filter: blur(10px); transition: opacity .4s; }
  #bar.hidden, #bar.idle { opacity: 0; pointer-events: none; }
  #bar .sep { width: 1px; background: rgba(80,160,255,.22); margin: 2px 4px; }
  button, label.btn { font: inherit; color: var(--fg); background: rgba(40,90,150,.18); cursor: pointer;
    border: 1px solid rgba(80,160,255,.25); border-radius: 9px; padding: 6px 11px; }
  button:hover, label.btn:hover { background: rgba(60,130,220,.32); }
  button.on { background: rgba(58,176,255,.35); border-color: var(--accent); }
  button:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  kbd { color: var(--dim); font: inherit; font-size: 10px; margin-left: 4px; }
  #hint { position: fixed; right: 18px; top: 14px; font-size: 11px; color: var(--dim); text-align: right; }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  #textpanel { position: fixed; right: 18px; top: 44px; width: min(440px, 92vw); display: flex; flex-direction: column;
    gap: 8px; padding: 12px; background: rgba(6,14,26,.82); border: 1px solid rgba(80,160,255,.28);
    border-radius: 14px; backdrop-filter: blur(10px); }
  #textpanel[hidden] { display: none; }
  #textpanel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #textpanel .row.head { justify-content: space-between; }
  #textpanel textarea { width: 100%; min-height: 130px; resize: vertical; font: inherit; color: var(--fg);
    background: rgba(2,8,18,.7); border: 1px solid rgba(80,160,255,.25); border-radius: 9px; padding: 8px 10px; }
  #textpanel select { font: inherit; color: var(--fg); background: rgba(40,90,150,.25);
    border: 1px solid rgba(80,160,255,.25); border-radius: 9px; padding: 5px 8px; max-width: 200px; }
  #textpanel input[type=range] { width: 110px; accent-color: var(--accent); }
  #tp-note { font-size: 11px; color: var(--dim); }
  #tp-progress { font-size: 11px; color: var(--dim); }

  /* субтитры: по умолчанию середина экрана справа от лица */
  #subs { position: fixed; z-index: 4; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  #subs.off { display: none; }
  #subs.pos-right { left: calc(50% + 28vh); right: 3%; top: 50%; transform: translateY(-50%); align-items: flex-start; text-align: left; }
  #subs.pos-left { left: 3%; right: calc(50% + 28vh); top: 50%; transform: translateY(-50%); align-items: flex-end; text-align: right; }
  #subs.pos-bottom { left: 50%; bottom: 96px; transform: translateX(-50%); width: min(80vw, 760px); align-items: center; text-align: center; }
  @media (max-aspect-ratio: 4/5) {
    #subs.pos-right, #subs.pos-left { left: 50%; right: auto; top: auto; bottom: 96px; transform: translateX(-50%);
      width: min(90vw, 560px); align-items: center; text-align: center; }
  }
  #subs .line { font-size: 19px; line-height: 1.35; color: #e6f6ff; text-shadow: 0 0 18px rgba(60,170,255,.55), 0 1px 3px #000;
    animation: subin .35s ease-out; transition: opacity .9s; }
  #subs .line.user { font-size: 15px; color: #8fb3cc; }
  #subs .line.user::before { content: "Вы: "; opacity: .7; }
  #subs .line.out { opacity: 0; }
  @keyframes subin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: min(86vw, 640px); z-index: 6;
    padding: 8px 14px; border-radius: 10px; background: rgba(6,14,26,.86); border: 1px solid rgba(255,170,80,.35);
    color: #ffe2bf; font-size: 13px; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }
  /* окно камеры: видео + скелет рук и контуры лица */
  #camdbg { position: fixed; left: 14px; bottom: 14px; width: 300px; z-index: 5; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(80,160,255,.3); background: #000; }
  #camdbg.off { left: -2000px; opacity: 0; pointer-events: none; }
  #camdbg .frame { position: relative; aspect-ratio: 16/9; }
  #camdbg video, #camdbg canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #camstat { padding: 5px 8px; font-size: 10px; line-height: 1.35; color: #9fc4de; background: rgba(6,14,26,.9); }
  /* индикатор микрофона в диалоге */
  #micmeter { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  #micmeter[hidden] { display: none; }
  #micmeter .mbar { position: relative; width: 120px; height: 6px; border-radius: 3px; background: rgba(80,160,255,.18); }
  #micmeter .mbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); transition: width .08s; }
  #micmeter .mbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: rgba(255,170,80,.9); }
  /* панели «Характер» и «Настройки» */
  .panel { position: fixed; right: 18px; top: 44px; width: min(440px, 92vw); max-height: calc(100vh - 150px); overflow: auto; z-index: 5;
    display: flex; flex-direction: column; gap: 8px; padding: 12px; background: rgba(6,14,26,.86); border: 1px solid rgba(80,160,255,.28);
    border-radius: 14px; backdrop-filter: blur(10px); }
  .panel[hidden] { display: none; }
  .panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel .row.head { justify-content: space-between; }
  .panel .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-top: 4px; }
  .panel textarea, .panel input[type=text] { width: 100%; font: inherit; color: var(--fg); background: rgba(2,8,18,.7);
    border: 1px solid rgba(80,160,255,.25); border-radius: 9px; padding: 8px 10px; }
  #pp-prompt { min-height: 190px; resize: vertical; font-size: 12px; line-height: 1.4; }
  #st-log { font-size: 11px; min-height: 110px; resize: vertical; }
  .panel select { font: inherit; color: var(--fg); background: rgba(40,90,150,.25); border: 1px solid rgba(80,160,255,.25);
    border-radius: 9px; padding: 5px 8px; }
  .panel .chk { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .panel .note, #pp-note { font-size: 11px; color: var(--dim); white-space: pre-line; }
  #pp-note.bad { color: #ff9a8a; }
  .trait { display: grid; grid-template-columns: 110px 1fr 74px; gap: 8px; align-items: center; font-size: 12px; }
  .trait .tbar { height: 6px; border-radius: 3px; background: rgba(80,160,255,.18); overflow: hidden; }
  .trait .tbar i { display: block; height: 100%; background: linear-gradient(90deg, #3ab0ff, #ffb04a); transition: width .8s; }
  .trait em { font-style: normal; text-align: right; color: var(--dim); }
  .trait small { color: #ffb04a; }
  .trait.flash .tbar { box-shadow: 0 0 10px rgba(255,176,74,.8); }
  #pp-memory { margin: 0; padding-left: 18px; font-size: 12px; color: #a9c8de; max-height: 120px; overflow: auto; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="status"></div>
<div id="hint">H — скрыть панель · F — во весь экран · V — диалог · S — субтитры</div>
<div id="subs" class="pos-right"></div>
<div id="toast"></div>

<div id="bar">
  <button data-state="idle">Покой<kbd>1</kbd></button>
  <button data-state="listening">Слушает<kbd>2</kbd></button>
  <button data-state="thinking">Думает<kbd>3</kbd></button>
  <button data-state="speaking">Говорит<kbd>4</kbd></button>
  <div class="sep"></div>
  <button data-shape="head">Гуманоид<kbd>Q</kbd></button>
  <button data-shape="sphere">Сфера<kbd>W</kbd></button>
  <button data-shape="wave">Волна<kbd>E</kbd></button>
  <button data-shape="torus">Портал<kbd>R</kbd></button>
  <div class="sep"></div>
  <button data-voice="clean" title="Голос без обработки">Оригинал<kbd>5</kbd></button>
  <button data-voice="assistant" title="Тёмный синтетический голос по измерениям референса">Ассистент<kbd>6</kbd></button>
  <button data-voice="vocoder" title="Монотонный робот-вокодер">Вокодер<kbd>7</kbd></button>
  <button data-voice="choir" title="Несколько слоёв голоса + кольцевая модуляция">Хор<kbd>8</kbd></button>
  <div class="sep"></div>
  <button id="btn-demo">Демо-голос<kbd>D</kbd></button>
  <button id="btn-mic">Микрофон<kbd>M</kbd></button>
  <label class="btn">Аудиофайл<input id="file" type="file" accept="audio/*"></label>
  <button id="btn-replay" disabled title="Проиграть последний файл или текст сначала">Повтор<kbd>P</kbd></button>
  <button id="btn-loop" title="Повторять непрерывно">Цикл<kbd>L</kbd></button>
  <button id="btn-text" title="Загрузить текст и читать вслух">Текст<kbd>T</kbd></button>
  <button id="btn-intro" title="Показать сборку лица из потока заново">Интро<kbd>I</kbd></button>
  <div class="sep"></div>
  <button id="btn-dialog" title="Голосовой диалог с Ясенем: слышит вас, отвечает через Codex">Диалог<kbd>V</kbd></button>
  <button id="btn-persona" title="Характер и системный промпт">Характер<kbd>G</kbd></button>
  <button id="btn-subs" title="Субтитры вкл/выкл">Субтитры<kbd>S</kbd></button>
  <button id="btn-settings" title="Настройки: субтитры, диалог, камера">Настройки<kbd>O</kbd></button>
  <button id="btn-cam">Камера<kbd>C</kbd></button>
  <button id="btn-sfx" class="on">Звуки<kbd>X</kbd></button>
</div>

<section id="textpanel" hidden aria-label="Чтение текста">
  <div class="row head"><b>Чтение текста</b><span id="tp-progress"></span><button id="tp-close" aria-label="Закрыть панель">×</button></div>
  <textarea id="tp-text" placeholder="Вставьте текст или загрузите файл .txt"></textarea>
  <div class="row">
    <label class="btn">Загрузить .txt<input id="tp-file" type="file" accept=".txt,.md,text/plain"></label>
    <select id="tp-voice" aria-label="Голос чтения"><option value="">Голос: авто</option></select>
    <label>Скорость <input id="tp-rate" type="range" min="-5" max="5" value="0"></label>
  </div>
  <div class="row"><button id="tp-read">Читать</button><button id="tp-stop">Стоп</button><span id="tp-note"></span></div>
</section>

<div id="camdbg" class="off"><div class="frame"><video id="camvid" muted playsinline></video><canvas id="camcv"></canvas></div><div id="camstat">камера выключена</div></div>
<div id="micmeter" hidden><span id="mm-label">слушаю</span><div class="mbar"><i id="mm-fill"></i><b id="mm-thr"></b></div></div>

<section id="persona" class="panel" hidden aria-label="Характер Ясеня">
  <div class="row head"><b>Характер Ясеня</b><button data-close="persona" aria-label="Закрыть панель">×</button></div>
  <div class="lbl">Системный промпт</div>
  <textarea id="pp-prompt" spellcheck="false"></textarea>
  <div class="row"><button id="pp-save">Применить</button><button id="pp-default">Исходный промпт</button><span id="pp-note"></span></div>
  <div class="lbl">Черты характера</div>
  <div id="pp-traits"></div>
  <label class="chk"><input type="checkbox" id="pp-learn"> Характер меняется от общения</label>
  <div class="lbl">Что Ясень помнит о вас <span id="pp-turns"></span></div>
  <ul id="pp-memory"></ul>
  <div class="row"><button id="pp-reset">Сбросить черты и память</button></div>
</section>

<section id="settings" class="panel" hidden aria-label="Настройки">
  <div class="row head"><b>Настройки</b><button data-close="settings" aria-label="Закрыть панель">×</button></div>
  <div class="lbl">Субтитры</div>
  <label class="chk"><input type="checkbox" id="st-subs"> Показывать субтитры</label>
  <div class="row"><label>Положение
    <select id="st-pos"><option value="right">Справа от лица (по умолчанию)</option><option value="left">Слева от лица</option><option value="bottom">Внизу по центру</option></select></label></div>
  <label class="chk"><input type="checkbox" id="st-user"> Показывать и мои слова</label>
  <div class="lbl">Диалог</div>
  <div class="row">
    <label>Язык речи <select id="st-lang"><option value="ru">Русский</option><option value="en">English</option><option value="auto">Авто</option></select></label>
    <label>Глубина Codex <select id="st-effort"><option value="low">низкая (быстрее)</option><option value="medium">средняя</option><option value="high">высокая</option></select></label>
  </div>
  <div class="row"><label style="flex:1">Модель Codex <input type="text" id="st-model" placeholder="по умолчанию"></label></div>
  <label class="chk"><input type="checkbox" id="st-filler"> Короткая реплика, пока Ясень думает</label>
  <div class="note" id="st-info">…</div>
  <div class="lbl">Камера</div>
  <label class="chk"><input type="checkbox" id="st-camdbg"> Показывать окно камеры (видео, руки, лицо)</label>
  <label class="chk"><input type="checkbox" id="st-mirror"> Повторять мою мимику, когда я молчу</label>
  <div class="row"><button id="st-diag">Проверить камеру</button><button id="st-diagcopy">Копировать отчёт</button></div>
  <textarea id="st-log" readonly placeholder="Здесь появится отчёт диагностики камеры"></textarea>
</section>

<script type="module" src="src/main.js"></script>
</body>
</html>
